<alert [maxItems]="3" [delay]="0"></alert>
<form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
  <div class="row">
    <div class="col-md-5 form-col">
      <img
        src="./assets/images/add_question.svg"
        class="img-fluid form-img"
        alt="Responsive image"
      />
    </div>

    <div class="col-md-7 form-col2" style="margin: auto">
      <div style="text-align: center">
        <h1>UPRAVIŤ KLIENTA</h1>
      </div>
    </div>

    <hr />
  </div>

  <mat-dialog-content class="dialog-text">
    <div class="form-group row">
      <label for="name" class="col-sm-2 col-form-label">Meno</label>
      <div class="col-sm-10">
        <input formControlName="name" type="text" class="form-control" />
      </div>
    </div>
    <div class="form-group row">
      <label for="surname" class="col-sm-2 col-form-label">Priezvisko</label>
      <div class="col-sm-10">
        <input formControlName="surname" type="text" class="form-control" />
      </div>
    </div>
    <div class="form-group row">
      <label for="contract_no" class="col-sm-2 col-form-label"
        >Číslo zmluvy</label
      >
      <div class="col-sm-10">
        <input formControlName="contract_no" type="text" class="form-control" />
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button mat-button mat-dialog-close class="cancel-button">ZRUŠIŤ</button>
    <button
      mat-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      class="submit-button"
      type="submit"
    >
      ULOŽIŤ
    </button>
  </mat-dialog-actions>
</form>
