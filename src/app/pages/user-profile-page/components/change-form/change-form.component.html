<alert [maxItems]="3" [delay]="0"></alert>

<form class="change" [formGroup]="changeForm" (ngSubmit)="onSubmit()">
  <div class="form-group row">
    <label for="name" class="col-md-2">Meno</label>
    <div class="col-md-10">
      <input
        type="text"
        class="form-control"
        formControlName="name"
        placeholder="Meno"
      />
    </div>
  </div>

  <!-- <div *ngIf="message" [class.message-bar-success]="!error" [class.message-bar-error]="error">{{ message }}</div> -->

  <div class="form-group row">
    <label for="surname" class="col-md-2">Priezvisko</label>
    <div class="col-md-10">
      <input
        matInput
        type="text"
        class="form-control"
        formControlName="surname"
        placeholder="Priezvisko"
      />
    </div>
  </div>

  <div class="button-position">
    <button mat-button class="submit-button" type="submit">Uložiť zmeny</button>
  </div>
</form>
