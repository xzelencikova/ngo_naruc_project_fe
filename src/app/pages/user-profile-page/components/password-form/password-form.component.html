<alert [maxItems]="3" [delay]="0"></alert>

<form class="change" [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
  <div class="form-group row">
    <label for="newPassword" class="col-md-2">Nové heslo</label>
    <div class="col-md-10">
      <div class="password-wrapper">
        <input
          [type]="showPasswordnew ? 'text' : 'password'"
          class="form-control"
          formControlName="newPassword"
          placeholder="*****"
        />
        <mat-icon
          class="password-toggle"
          (click)="togglePasswordVisibilitynew()"
          >{{ showPasswordnew ? "visibility_off" : "visibility" }}</mat-icon
        >
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label for="confirmPassword" class="col-md-2">Potvrdiť nové heslo</label>
    <div class="col-md-10">
      <div class="password-wrapper">
        <input
          [type]="showPasswordconfirm ? 'text' : 'password'"
          class="form-control"
          formControlName="confirmPassword"
          placeholder="*****"
        />
        <mat-icon
          class="password-toggle"
          (click)="togglePasswordVisibilityconfirm()"
          >{{ showPasswordconfirm ? "visibility_off" : "visibility" }}</mat-icon
        >
      </div>
    </div>
  </div>

  <alert [maxItems]="3" [delay]="0"></alert>
  <!-- <div *ngIf="message" [class.message-bar-success]="!error" [class.message-bar-error]="error">{{ message }}</div> -->

  <div class="button-position">
    <button mat-button class="submit-button" type="submit">Zmeniť heslo</button>
  </div>
</form>
