<alert [maxItems]="3" [delay]="0"></alert>

<form [formGroup]="questForm" (ngSubmit)="onSubmit()">
  <div class="row">
    <div class="col-md-5">
      <img
        src="./assets/images/create_client.svg"
        class="img-fluid form-img"
        alt="Responsive image"
      />
    </div>

    <div class="col-md-7">
      <h1>Pridať nového klienta</h1>
    </div>
  </div>

  <hr />

  <mat-dialog-content class="dialog-text">
    <div class="row form-group">
      <label for="client-name" class="col-md-3">Meno klienta</label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          id="client-name"
          formControlName="clientName"
        />
      </div>
    </div>

    <div class="form-group row">
      <label for="client-surname" class="col-md-3"> Priezvisko klienta </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          id="client-surname"
          formControlName="clientSurname"
        />
      </div>
    </div>

    <div class="form-group row">
      <label for="contract-number" class="col-md-3"> Číslo zmluvy </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          id="contract-number"
          formControlName="contractNumber"
          appContractNumberFormatter
        />
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button mat-button mat-dialog-close class="cancel-button">ZRUŠIŤ</button>
    <button
      mat-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      class="submit-button"
      type="submit"
    >
      VYTVORIŤ
    </button>
  </mat-dialog-actions>
</form>
