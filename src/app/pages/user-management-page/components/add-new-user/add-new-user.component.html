<alert [maxItems]="3" [delay]="0"></alert>

<form [formGroup]="questForm" (ngSubmit)="onSubmit()">
  <div class="row">
    <div class="col-md-5">
      <img
        src="./assets/images/add_user.svg"
        class="img-fluid form-img"
        alt="Responsive image"
      />
    </div>

    <div class="col-md-7" style="margin: auto">
      <div>
        <h1>Pridať nového zamestnanca</h1>
      </div>
    </div>
  </div>
  <hr />

  <mat-dialog-content class="dialog-text">
    <div class="form-group row">
      <label for="user-name" class="col-md-2">Meno</label>
      <div class="col-md-10">
        <input
          type="text"
          class="form-control"
          id="user-name"
          formControlName="userName"
        />
      </div>
    </div>
    <div class="form-group row">
      <label for="user-surname" class="col-md-2">Priezvisko</label>
      <div class="col-md-10">
        <input
          type="text"
          class="form-control"
          id="user-surname"
          formControlName="userSurname"
        />
      </div>
    </div>
    <div class="form-group row">
      <label for="user-email" class="col-md-2">Email</label>
      <div class="col-md-10">
        <input
          type="text"
          class="form-control"
          id="user-email"
          formControlName="userEmail"
        />
      </div>
    </div>
    <div class="form-group row">
      <label for="user-role" class="col-md-2">Rola</label>
      <div class="col-md-10">
        <div class="form-check-inline">
          <label class="form-check-label" for="user-role1">
            <input
              type="radio"
              class="form-control-radio"
              id="user-role1"
              value="admin"
              formControlName="userRole"
            />Admin
          </label>
        </div>
        <div class="form-check-inline">
          <label class="form-check-label" for="user-role2">
            <input
              type="radio"
              class="form-control-radio"
              id="user-role2"
              value="guest"
              formControlName="userRole"
              checked
            />Hosť
          </label>
        </div>
      </div>
    </div>
    <div class="form-group row">
      <label for="user-password" class="col-md-2">Heslo</label>
      <div class="col-md-10 password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="userPassword"
          placeholder="Heslo"
        />
        <mat-icon class="password-toggle" (click)="togglePasswordVisibility()">
          {{ showPassword ? "visibility_off" : "visibility" }}
        </mat-icon>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button mat-button mat-dialog-close class="cancel-button">ZRUŠIŤ</button>
    <button
      mat-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      class="submit-button"
      type="submit"
    >
      VYTVORIŤ
    </button>
  </mat-dialog-actions>
</form>
