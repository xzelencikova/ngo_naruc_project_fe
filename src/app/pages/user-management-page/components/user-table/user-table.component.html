<div style="padding: 1rem 2rem; display: flex; justify-content: space-between">
  <div style="width: 70%">
    <div class="form-group row">
      <div class="col-sm-10 size-input-wrapper">
        <input
          #searchVal
          placeholder="Vyhľadaj zamestnanca"
          type="text"
          class="form-control"
          (keyup)="applyFilter(searchVal.value)"
        />
        <span><i class="fas fa-search"></i></span>
      </div>
    </div>
  </div>
  <div>
    <button
      mat-button
      color="primary"
      type="button"
      (click)="openAddUserForm()"
    >
      <i class="fas fa-plus"></i> Pridať zamestnanca
    </button>
  </div>
</div>

<alert [maxItems]="3" [delay]="0"></alert>

<table mat-table [dataSource]="dataSource" class="user-table" matSort>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Meno</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="surname">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Priezvisko</th>
    <td mat-cell *matCellDef="let element">{{ element.surname }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
    <td mat-cell *matCellDef="let element">{{ element.email }}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Admin</th>
    <td mat-cell *matCellDef="let element">
      <mat-checkbox
        #refRole
        color="warn"
        [checked]="element.role == 'admin'"
        (change)="changeUserRole($event, element)"
      ></mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef>Vymazať</th>
    <td mat-cell *matCellDef="let element">
      <button
        mat-icon-button
        color="primary"
        (click)="deleteUserDialog(element)"
      >
        <i class="fas fa-xl fa-trash-can"></i>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator
  #paginator
  [pageSize]="7"
  [hidePageSize]="true"
  showFirstLastButtons
  aria-label=""
>
</mat-paginator>
